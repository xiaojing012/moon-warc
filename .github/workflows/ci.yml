name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1.22

      - name: Toolchain
        run: moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Public interface
        run: moon info

      - name: Strict four-target check
        run: moon check --target all --deny-warn

      - name: Four-target build
        run: moon build --target all

      - name: Strict four-target tests
        run: moon test --target all --deny-warn

      - name: Run CLI
        run: moon run cli stats

      - name: Run examples
        run: moon run examples index

      - name: Package check
        run: moon package --list
